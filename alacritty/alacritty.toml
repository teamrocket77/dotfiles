[window]
opacity = 0.95
blur = true
option_as_alt = "Both"
decorations = "Buttonless"
dynamic_title = false

[font]
# size = 17.0 # Adjust as needed
size = 14.0
normal = {family = "JetBrainsMono Nerd Font"}

[cursor]
style = { shape = "Block", blinking = "Always"}

[scrolling]
multiplier = 3
history = 10000

[keyboard]
bindings = [
  # Cmd+Backspace -> Ctrl-U: zsh emacs ^U is kill-whole-line (delete entire line).
  { key = "Back",  mods = "Command", chars = "\u0015" },
  # Cmd+Left -> Ctrl-A (beginning-of-line), Cmd+Right -> Ctrl-E (end-of-line).
  { key = "Left",  mods = "Command", chars = "\u0001" },
  { key = "Right", mods = "Command", chars = "\u0005" },
]
