# rg config for <Space>gup (mini.pick grep_live, unrestricted).
# --no-ignore ignores .gitignore/.ignore/.rgignore so gitignored trees like
# .venv/ are searched; --hidden also descends into dot-directories (.venv is
# both). .git/ stays excluded so we don't grep git internals / pack files.
--hidden
--no-ignore
--glob=!.git/
