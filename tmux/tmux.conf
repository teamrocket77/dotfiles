set -g default-terminal "xterm-256color"
set -g prefix C-a
set -g base-index 1
set -g history-limit 50000
set -g display-time 1000
set -s escape-time 200

# setw pane-base-index 1
setw -g mode-keys vi

set-option -a terminal-overrides ",alacritty:RGB,xterm-ghostty:RGB"
set-option -g repeat-time 100
set-option -g mouse on
set-option -g status-position top
set-option -s set-clipboard off
set -g pane-border-style fg=brightblack,bg=black
set -g pane-active-border-style fg=blue,bg=black
set-window-option -g window-active-style bg=terminal
set-window-option -g window-style bg=black
set-window-option -g window-status-style bg=default,fg=default
set-window-option -g window-status-current-style bg=default,fg=cyan
set-window-option -g window-status-activity-style bg=default,fg=yellow
set-window-option -g window-status-separator ""
set-window-option -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold,fg=#89b4fa]#I:#W#[fg=#f38ba8]#{?window_zoomed_flag, [Z],} #[default]"
# Set overall status bar background to default (transparent/inherited)
set -g status-style "bg=default,fg=default"

# Ensure inactive window tabs also use the default background
set -g window-status-style "bg=default,fg=default"

# Optional: Keep active window highlighted or transparent with bold text
set -g window-status-current-style "bg=default,fg=colour4,bold"
# Update interval (default is 15s; 2-5s is good for system stats)
# Force tmux to refresh the status line every 2 seconds
set -g status-interval 2
set -g status-right-length 120

if-shell '[ -f "$HOME/dotfiles/tmux/stats.sh" ]' {
	set -g status-right "#[fg=#a6e3a1]^#{b:socket_path} #[fg=#6c7086]| #[fg=#f9e2af]#($HOME/dotfiles/tmux/stats.sh) #[fg=#6c7086]| #[fg=#89b4fa]%H:%M "
} {
	if-shell '[ -f "$HOME/.config/tmux/stats.sh" ]' {
		set -g status-right "#[fg=#a6e3a1]^#{b:socket_path} #[fg=#6c7086]| #[fg=#f9e2af]#($HOME/.config/tmux/stats.sh) #[fg=#6c7086]| #[fg=#89b4fa]%H:%M "
	} {
		set -g status-right "#[fg=#a6e3a1]^#{b:socket_path} #[fg=#6c7086]| #[fg=#89b4fa]%H:%M "
	}
}

set-environment -g TMUX_CONF "$HOME/.config/tmux/tmux.conf"
set -g command-alias src="source-file ~/.config/tmux/tmux.conf"

unbind C-b
unbind % 
unbind '"'
unbind h
unbind j
unbind k
unbind l
unbind s
unbind t

bind-key C-a send-prefix

# easy-to-remember split pane commands
# TODO: consider making a nav mode for tmux

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind P paste-buffer
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind M-s popup -xC -yC -w70% -h70% -E "tmux new -A -s scratch"
bind -T copy-mode-vi v send-keys -X copy-pipe-and-cancel "pbcopy"

bind s split-window -v "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind w split-window -v "tmux list-windows | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux select-window -t"

if-shell '[ ! -d ~/.tmux/plugins/tpm ]' {
    run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"
}


# list found here
# https://github.com/tmux-plugins/list
set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jeffnguyen695/tmux-zoxide-session'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
