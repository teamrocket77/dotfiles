set -g default-terminal "xterm-256color"
set -g prefix C-a
set -g base-index 1
set -g history-limit 50000
set -g display-time 1000
set -s escape-time 200

# setw pane-base-index 1
setw -g mode-keys vi

set-option -a terminal-overrides ",alacritty:RGB,xterm-ghostty:RGB"

# Extended (CSI-u) key reporting so modified keys like Shift+Enter survive tmux
# instead of collapsing to plain Enter. tmux only forwards them when both the
# outer terminal and the inner app negotiate the protocol, so advertise extkeys
# for the terminals actually used (alacritty/kitty/xterm-ghostty + xterm*).
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty*:extkeys'
set -as terminal-features 'xterm-kitty:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'
set-option -g repeat-time 400
set-option -g mouse on
set-option -g status-position top
set-option -s set-clipboard off
set -g pane-border-style fg=brightblack,bg=black
set -g pane-active-border-style fg=blue,bg=black
# Dim inactive panes: active keeps normal (transparent) colours; inactive panes
# get a greyed-out foreground while staying transparent (bg=terminal preserves
# the Alacritty opacity/blur). NOTE: this only dims text drawn with the default
# colours — full-screen TUIs that paint their own bg/fg (nvim, etc.) won't dim.
set-window-option -g window-active-style 'fg=terminal,bg=terminal'
set-window-option -g window-style 'fg=#7f849c,bg=terminal'
set-window-option -g window-status-style bg=default,fg=default
set-window-option -g window-status-current-style bg=default,fg=cyan
set-window-option -g window-status-activity-style bg=default,fg=yellow
# Empty separator so the window pills abut: the inactive surface background
# runs continuously with no transparent gaps, and the active window is a solid
# block within it.
set-window-option -g window-status-separator ""
set -g renumber-windows on
# Every window shows #index:#name so applications are told apart at a glance.
# Inactive windows get a muted surface pill (grey bg, light fg); the active
# window is a bright filled blue pill with dark text for maximum contrast.
set-window-option -g window-status-format "#[fg=#bac2de,bg=#313244] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W#[fg=#f38ba8]#{?window_zoomed_flag, [Z],}#[fg=#11111b] #[default]"
# Fill the whole bar with the surface colour so the left (mode + host) and
# right (session + time) segments share the same highlighted background as the
# window pills — the bar reads as one continuous strip.
set -g status-style "bg=#313244,fg=#cdd6f4,underscore"

# Update interval (default is 15s; 2-5s is good for system stats)
# Force tmux to refresh the status line every 2 seconds
set -g status-interval 2
set -g status-right-length 120

# Machine label for the status bar, resolved once at load instead of on every
# status-interval: it cannot change while the server is running, so a #() here
# would fork every 2s just to reprint the same four characters.
#
# Deliberately inline rather than a helper script -- inside a container the
# dotfiles usually are not mounted, which is precisely where the label matters.
# Containers get an @ prefix so a random 12-hex container ID is never mistaken
# for a real machine; macOS prefers ComputerName because the hostname goes
# stale on VPN. '#' is stripped since ComputerName is free-form and would
# otherwise be parsed as a format directive.
if-shell '[ -f /.dockerenv ] || [ -f /run/.containerenv ] || [ -n "$container" ] || grep -qaE "docker|lxc|containerd|kubepods|podman" /proc/1/cgroup 2>/dev/null' {
	run-shell 'tmux set -g @host_label "@$( { hostname 2>/dev/null || cat /etc/hostname; } | tr -d "#" | cut -c1-4 )"'
} {
	if-shell '[ "$(uname -s)" = Darwin ]' {
		run-shell 'tmux set -g @host_label "$( { scutil --get ComputerName 2>/dev/null || hostname -s; } | tr -d "#" | cut -c1-4 )"'
	} {
		run-shell 'tmux set -g @host_label "$( { hostname -s 2>/dev/null || hostname; } | tr -d "#" | cut -c1-4 )"'
	}
}

# MUX block reacts to context, with colours pulled from the terminal's ANSI
# palette (named colours, not hex) so it tracks the active colour scheme without
# edits: prefix pending -> yellow "PRE", nvim in the active pane -> green "VIM",
# otherwise blue "MUX". Commas inside #[...] are escaped as #, so they aren't
# read as #{?...} argument separators.
set -g status-left "#{?client_prefix,#[fg=yellow#,bold] PRE ,#{?#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}},#[fg=green#,bold] VIM ,#[fg=blue#,bold] MUX }}#[fg=#6c7086]|#[fg=#a6e3a1,bold] #{@host_label} #[fg=#6c7086]|#[default] "
set -g status-left-length 40

set -g status-right "#{agent_indicator} #[fg=#a6e3a1]#S#{?#{==:#{b:socket_path},default},,:#{b:socket_path}} #[fg=#6c7086]| #[fg=#89b4fa]%H:%M "

set-environment -g TMUX_CONF "$HOME/.config/tmux/tmux.conf"
set -g command-alias src="source-file ~/.config/tmux/tmux.conf \; display-message -d 500 'Config reloaded!'"

unbind C-b
unbind % 
unbind '"'
unbind h
unbind j
unbind k
unbind l
unbind s
unbind t

bind-key C-a send-prefix

# easy-to-remember split pane commands
# TODO: consider making a nav mode for tmux

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Kill the current pane with no confirmation. Reached from kitty's cmd+p, which
# sends prefix (C-a = \x01) + X; the safe confirm-before default stays on `x`.
bind X kill-pane
bind P paste-buffer
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r n next-window
bind -r p previous-window

# Prefix-free window nav, mirroring the rootless C-hjkl pane nav one Shift up:
# C-S-h / C-S-l = previous / next window. Relies on extended-keys (CSI-u) so
# tmux can tell C-S-h apart from C-h; no vim guard (nvim doesn't use these).
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Seamless nvim <-> tmux pane navigation (alexghergh/nvim-tmux-navigation).
# Root-table C-h/j/k/l: if the pane runs a (n)vim process, forward the key so
# nvim can move between its own splits; otherwise select the tmux pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
# Scratch popup toggle: opens centered; press again (from inside or outside) to close.
# Popups can't be dragged/moved in tmux, so after resizing the terminal just
# toggle it off and on — it re-centers on open and the scratch session persists.
bind M-s if-shell -F '#{==:#{session_name},scratch}' {
	detach-client
} {
	popup -xC -yC -w70% -h70% -E "tmux new -A -s scratch"
}
bind -T copy-mode-vi v send-keys -X copy-pipe-and-cancel "pbcopy"

# s: fuzzy-pick a ~/code subdir and open it as a window (terminal/nvim/claude).
# tmux port of kitty winmode `s`. Runs in a popup so fzf has a clean full-screen
# surface; the script issues the tmux new-window/split commands itself.
bind s popup -xC -yC -w70% -h70% -E "$HOME/.config/tmux/new-code-session.sh"
# S: session switcher (was `s`).
bind S split-window -v "tmux list-sessions -F '#{session_name}' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs -r tmux switch-client -t"
bind w split-window -v "tmux list-windows -F '#{window_index}: #{window_name}#{?window_active, (active),}' | fzf --reverse | cut -d: -f1 | xargs -r tmux select-window -t"

# VPN pickers in a popup (reuse the kitty-dir scripts — they're terminal-agnostic).
# v: Pritunl (winmode v) · V: OpenVPN Connect (winmode shift+v).
bind v popup -xC -yC -w60% -h60% -E "$HOME/.config/kitty/vpn.sh"
bind V popup -xC -yC -w60% -h60% -E "$HOME/.config/kitty/vpn-ovpn.sh"

if-shell '[ ! -d ~/.tmux/plugins/tpm ]' {
    run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"
}

bind -T root F12 {
	set prefix None
	set key-table off
	set mouse off
	set status-style "bg=#313244,fg=#6c7086"
	set status-left "#[bg=#f38ba8,fg=#11111b,bold] KEYS OFF #[bg=#313244,fg=#6c7086] #{@host_label} #[fg=#585b70]|#[default] "
	set status-right "#[fg=#6c7086]^#{b:socket_path} #[fg=#585b70]| #[fg=#6c7086]F12 resumes #[fg=#585b70]| #[fg=#6c7086]%H:%M "
	if-shell -F '#{pane_in_mode}' 'send-keys -X cancel'
	refresh-client -S
}

bind -T off F12 {
	set -u prefix
	set -u key-table
	set -u mouse
	set -u status-style
	set -u status-left
	set -u status-right
	refresh-client -S
}


# list found here
# https://github.com/tmux-plugins/list
set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jeffnguyen695/tmux-zoxide-session'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
